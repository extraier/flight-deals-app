name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: "ESLint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  test-cards:
    name: "Test - Couple cards (TS)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+ is required for `--experimental-strip-types` (see
          # the test:cards script in package.json). Node 24 LTS also
          # works but Node 22 LTS is the safer target since it
          # matches the version pinned in AGENTS.md recommendations.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:cards

  test-alerter:
    name: "Test - Telegram alerter (Python)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Run send_flight_report.py unit tests"
        run: npm run test:alerter
      - name: "Smoke-import the script (catches syntax errors)"
        run: |
          cd scanner
          python3 -c "import send_flight_report; print('OK: importable')"

  build:
    name: "Next.js build"
    runs-on: ubuntu-latest
    needs: [test-alerter, test-cards]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Next.js prerenders static pages during build. /match/account
      # imports @/lib/firebase/client, which calls initializeApp() at
      # module-eval time and validates every NEXT_PUBLIC_FIREBASE_*
      # env var. Provide dummy values so the build completes — actual
      # auth happens at runtime in the browser, not at build time.
      # Real keys live in Vercel env vars and are NOT needed for the
      # build artifact to be valid.
      - name: Build with dummy Firebase env
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDUMMY-BUILD-TIME-KEY-NOT-A-REAL-ONE"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "savetheday-2377a-dummy.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "savetheday-2377a-dummy"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "savetheday-2377a-dummy.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
        run: npm run build
