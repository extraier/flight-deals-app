name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: "ESLint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  test-cards:
    name: "Test - Couple cards (TS)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:cards

  test-alerter:
    name: "Test - Telegram alerter (Python)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Run send_flight_report.py unit tests"
        run: npm run test:alerter
      - name: "Smoke-import the script (catches syntax errors)"
        run: |
          cd scanner
          python3 -c "import send_flight_report; print('OK: importable')"

  build:
    name: "Next.js build"
    runs-on: ubuntu-latest
    # Don't gate build on lint/test-cards: those are pre-existing issues
    # in src/ unrelated to this workflow's purpose. They show as
    # standalone job failures in the PR but don't break the build.
    needs: [test-alerter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
